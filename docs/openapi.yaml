openapi: 3.0.3
info:
  title: Sales POS System API
  version: 1.0.0
  description: RESTful API for Sales/POS & Back-office System

servers:
  - url: http://localhost:8080/api
    description: Local development
  - url: https://api.yourpos.com/api
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { type: string } }
        locale: { type: string, enum: [en, ar] }

    Product:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string }
        barcode: { type: string, nullable: true }
        name: { type: string }
        type: { type: string, enum: [simple, variant, bundle, service] }
        cost_price: { type: number, format: decimal }
        sale_price: { type: number, format: decimal }
        category_id: { type: integer }
        is_active: { type: boolean }

    Sale:
      type: object
      properties:
        id: { type: integer }
        invoice_number: { type: string }
        customer_id: { type: integer, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/SaleItem' } }
        subtotal: { type: number }
        tax_total: { type: number }
        grand_total: { type: number }
        status: { type: string, enum: [completed, refunded, partial] }
        created_at: { type: string, format: date-time }

    SaleItem:
      type: object
      properties:
        product_id: { type: integer }
        quantity: { type: number }
        unit_price: { type: number }
        discount: { type: number }
        total: { type: number }

    SyncRequest:
      type: object
      properties:
        last_sync: { type: string, format: date-time }
        operations:
          type: array
          items:
            type: object
            properties:
              idempotency_key: { type: string, format: uuid }
              type: { type: string, enum: [sale, adjustment] }
              data: { type: object }

paths:
  /auth/login:
    post:
      summary: User login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200:
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }

  /auth/me:
    get:
      summary: Get current user
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /products:
    get:
      summary: List products
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        200:
          description: Paginated products

    post:
      summary: Create product
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        201:
          description: Created product

  /products/{id}:
    get:
      summary: Get product
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Product details

  /sales/pos:
    post:
      summary: Create POS sale
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, payments]
              properties:
                idempotency_key: { type: string, format: uuid }
                customer_id: { type: integer }
                warehouse_id: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      quantity: { type: number }
                      unit_price: { type: number }
                      discount: { type: number }
                payments:
                  type: array
                  items:
                    type: object
                    properties:
                      method: { type: string }
                      amount: { type: number }
      responses:
        201:
          description: Sale created

  /sales/{id}/refund:
    post:
      summary: Refund sale
      tags: [Sales]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Refund processed

  /stock/adjust:
    post:
      summary: Adjust stock
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                warehouse_id: { type: integer }
                product_id: { type: integer }
                quantity: { type: number }
                reason: { type: string }
      responses:
        200:
          description: Stock adjusted

  /warehouses/{id}/stock:
    get:
      summary: Get warehouse stock
      tags: [Inventory]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Stock levels

  /reports/sales:
    get:
      summary: Sales report
      tags: [Reports]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        200:
          description: Sales report data

  /local/sync:
    post:
      summary: Sync offline operations
      tags: [Sync]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        200:
          description: Sync result with conflicts
