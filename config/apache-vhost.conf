# Apache Virtual Host Configuration for Local Development
# Port 8080 Configuration

# Add to httpd.conf or httpd-vhosts.conf

# Ensure Apache listens on port 8080
Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/POS/backend/public"
    
    <Directory "C:/xampp/htdocs/POS/backend/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable mod_rewrite for Laravel
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.php$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.php [L]
        </IfModule>
    </Directory>

    # Logging
    ErrorLog "logs/pos-error.log"
    CustomLog "logs/pos-access.log" combined

    # PHP Settings (if using mod_php)
    <IfModule mod_php.c>
        php_value upload_max_filesize 10M
        php_value post_max_size 10M
        php_value max_execution_time 300
    </IfModule>
</VirtualHost>

# For HTTPS (production), use Let's Encrypt:
# sudo certbot --apache -d yourdomain.com
